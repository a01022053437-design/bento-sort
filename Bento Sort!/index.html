<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Bento Sort!</title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>


<body>

  <main
    class="game-shell"
    aria-label="Bento Sort 게임"
  >

    <section
      class="game"
      id="game"
    >


      <!-- =========================
           HUD
      ========================== -->

      <header class="hud">


        <!-- 설정 / 홈 -->
        <div class="hud-left">

          <button
            class="icon-button"
            id="settingsButton"
            aria-label="소리 설정"
            type="button"
          >
            <img
              src="assets/images/ui/btn_settings.png"
              alt=""
              draggable="false"
            />
          </button>


          <button
            class="icon-button"
            id="resetButton"
            aria-label="시작 화면으로 돌아가기"
            type="button"
          >
            <img
              src="assets/images/ui/btn_reset.png"
              alt=""
              draggable="false"
            />
          </button>

        </div>


        <!-- LEVEL -->
        <div class="level-panel">

          <img
            src="assets/images/ui/panel_level.png"
            alt=""
            draggable="false"
          />

          <span>
            LEVEL
            <b id="levelValue">1</b>
          </span>

        </div>


        <!-- TIMER -->
        <div
          class="timer-panel"
          aria-label="남은 시간"
        >

          <img
            src="assets/images/ui/panel_moves.png"
            alt=""
            draggable="false"
          />

          <b id="timerValue">
            01:30
          </b>

        </div>


      </header>


      <!-- =========================
           TRAYS
      ========================== -->

      <section
        class="tray-board"
        id="trayBoard"
        aria-label="음식 트레이"
      ></section>


      <!-- TOAST -->
      <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
      ></div>


      <!-- =========================
           CLEAR
      ========================== -->

      <section
        class="clear-overlay"
        id="clearOverlay"
        aria-modal="true"
        role="dialog"
        aria-label="레벨 클리어"
        hidden
      >

        <div class="clear-card">

          <img
            class="clear-bg"
            src="assets/images/ui/popup_clear.png"
            alt=""
            draggable="false"
          />


          <div class="clear-actions">

            <button
              class="image-button"
              id="restartButton"
              type="button"
              aria-label="다시 하기"
            >

              <img
                src="assets/images/ui/btn_restart.png"
                alt="다시 하기"
                draggable="false"
              />

            </button>


            <button
              class="image-button"
              id="nextButton"
              type="button"
              aria-label="다음 레벨"
            >

              <img
                src="assets/images/ui/btn_next.png"
                alt="다음 레벨"
                draggable="false"
              />

            </button>

          </div>

        </div>

      </section>


      <!-- =========================
           GAME OVER / 막힘
      ========================== -->

      <section
        class="gameover-overlay"
        id="gameOverOverlay"
        aria-modal="true"
        role="dialog"
        aria-label="다시 도전하기"
        hidden
      >

        <div class="gameover-box">

          <button
            class="gameover-restart-button"
            id="gameOverRestartButton"
            aria-label="다시 도전하기"
            type="button"
          >

            <img
              src="assets/images/ui/btn_restart.png"
              alt="다시 하기"
              draggable="false"
            />

          </button>

        </div>

      </section>


      <!-- =========================
           START
      ========================== -->

      <section
        class="start-overlay"
        id="startOverlay"
        aria-label="Bento Sort 시작 화면"
      >

        <div class="start-card">

          <img
            class="game-logo"
            src="assets/images/ui/logo_bento_sort.png"
            alt="Bento Sort!"
            draggable="false"
          />


          <div class="start-actions">


            <!-- 처음부터 -->
            <button
              class="start-button"
              id="startButton"
              aria-label="처음부터 시작"
              type="button"
            >

              <img
                src="assets/images/ui/btn_start.png"
                alt="시작하기"
                draggable="false"
              />

            </button>


            <!-- 이어하기 -->
            <button
              class="keep-button"
              id="continueButton"
              aria-label="이어하기"
              type="button"
              hidden
            >

              <img
                src="assets/images/ui/btn_keep.png"
                alt="이어하기"
                draggable="false"
              />

            </button>


          </div>

        </div>

      </section>


    </section>
    <!-- .game 끝 -->


  </main>


  <script src="script.js"></script>

</body>

</html>
